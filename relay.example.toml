listen = "127.0.0.1:8484"

# Optional. Where route state (ACTIVE / LIMITED / PROBING and its reset time)
# survives a restart, so a restart mid-limit doesn't go straight back to
# Anthropic. Absent means in-memory only. Must be an absolute path — `~` is
# not expanded.
# state_file = "/home/you/.local/state/relay/state.json"

[anthropic]
base_url = "https://api.anthropic.com"

# Limit detection (spec §5). The whole section is optional and every key has a
# default: what is written out below IS the built-in default, so omitting a key
# keeps it. Anything that doesn't match passes through to the client untouched
# and never changes route state.
#
# These values are derived from spec §5's *expected* shape, not from a captured
# real limit response (docs/decisions.md). Once `--capture-errors` has caught a
# genuine subscription-limit 429, re-derive them from that fixture — a config
# edit, not a rebuild, which is the point.
[detect]
status = 429
# Dotted paths into the JSON body that must all equal the given string.
match_body = { "error.type" = "rate_limit_error" }
# Case-insensitive substrings searched in `marker_field`. A hit is an explicit
# subscription marker, which classifies on its own regardless of the horizon.
marker_field = "error.message"
markers = ["usage limit", "subscription"]

# Reset-time sources in preference order: the first that yields a time wins.
# `from` is header | body (body names are dotted paths), and `format` is
# delta-seconds | unix-seconds | rfc3339.
[[detect.reset]]
from = "header"
name = "retry-after"
format = "delta-seconds"

[[detect.reset]]
from = "header"
name = "anthropic-ratelimit-unified-reset"
format = "unix-seconds"

# Anthropic's per-endpoint reset headers are RFC3339 rather than epoch seconds;
# add them the same way if a captured fixture shows them carrying the window:
# [[detect.reset]]
# from = "header"
# name = "anthropic-ratelimit-requests-reset"
# format = "rfc3339"

# Fallback targets (spec §8b). Zero or more named profiles; the names below
# ("deepseek", "kimi") and their model IDs are illustrative placeholders from
# the original design, not real endpoints — verify model IDs against the
# provider's own catalog before using one for real. `[profiles]` is entirely
# optional: with none configured, a `claude-*` request always goes to
# Anthropic and a non-`claude-*` request has nothing to route to (spec §7d).
#
# `base_url` is the provider's API *root*, not a full endpoint URL: the relay
# appends the path the format implies — `/v1/chat/completions` for an "openai"
# profile, whatever Anthropic path the client called, and the client's own path
# for an "anthropic" one. It must be https unless the host is loopback: this is
# where the profile's own API key travels, and plaintext off this machine is
# refused at startup rather than leaked once per request. It must also not carry
# userinfo (`https://user:secret@host`) — a credential there is silently
# discarded rather than sent, so it is refused at startup instead of sitting in
# this file doing nothing; the key goes in the env var `api_key_env` names.
#
# `api_key_env` names an environment variable the relay reads at request time.
# The key is sent as `Authorization: Bearer <key>`, and to an "anthropic"
# profile as `x-api-key` as well, which is the scheme that API documents.
# Nothing the client sent reaches a profile — not its auth headers, not its
# `anthropic-*` headers, not `accept-encoding` (spec §7b).
#
# [profiles.deepseek]
# base_url = "https://<provider-anthropic-compat-endpoint>"
# api_key_env = "RELAY_TOGETHER_KEY"      # read from env, never stored here
# format = "anthropic"                    # or "openai" (enables the translator)
# serves = ["deepseek-ai/", "Qwen/"]      # §7d: model-name prefixes this profile claims
# model_map = { "claude-opus" = "deepseek-ai/DeepSeek-V4", "*" = "deepseek-ai/DeepSeek-V4-Flash" }
#
# [profiles.kimi]
# base_url = "https://<other-endpoint>"
# api_key_env = "RELAY_MOONSHOT_KEY"
# format = "anthropic"
# serves = ["moonshotai/"]
# model_map = { "*" = "moonshotai/Kimi-K3" }
#
# Two things learned against real Together AI traffic (docs/decisions.md,
# Milestone 3 Task 5) before picking a model_map target:
# - Forced tool choice (Anthropic tool_choice "any"/"tool") needs a model
#   whose grammar backend can compile a real parameter schema.
#   Qwen/Qwen2.5-7B-Instruct-Turbo 422s on that; meta-llama/Llama-3.3-70B-
#   Instruct-Turbo handles it correctly. "auto"/"none" are unaffected either way.
# - A model priced in /v1/models is not necessarily reachable.
#   meta-llama/Meta-Llama-3.1-8B-Instruct-Turbo and mistralai/Mistral-7B-
#   Instruct-v0.3 both 400 as "non-serverless" — verify with a real request
#   before committing a model_map entry to one.

# Failover policy (spec §8). The whole section is optional and every key has a
# default: what is written out below IS the built-in default, except
# `active_profile`, which defaults to unset (no fallback selected at startup).
[policy]
# Which `claude-*` requests fail over to `active_profile` while Anthropic is
# LIMITED: "new-sessions" (only session-start requests), "all" (everything),
# or "notify-only" (never — passthrough to Anthropic, notification only).
mode = "new-sessions"
# Startup default; a runtime switch via `POST /control/profile` overrides it
# for new requests only and does not persist here. Must name a configured
# profile — unset (the default) means no fallback until one is set.
# active_profile = "deepseek"
# Whether the request that *trips* the limit is handed to the fallback rather
# than answered with Anthropic's limit error. Claude Code treats a
# subscription-limit 429 as terminal and does not retry, so passing that one
# through costs a visible hard failure — and a manual re-run — once per limit
# window. The response is classified before anything reaches the client, so
# nothing about this is a mid-stream switch. `false` restores the older
# behavior: the limit error goes to the client, the route still becomes
# LIMITED, and only later requests fail over. Same eligibility as every other
# failover — `mode`, `active_profile` and the `count_tokens` pin all apply.
failover_on_detect = true
# Without a marker, the reset must be further out than this to count as the
# subscription limit rather than an ordinary per-minute burst 429. It is also
# the floor under every window detection produces, so a stale reset time can't
# yield one that has already expired.
min_reset_horizon_secs = 300
# The ceiling on that window — a units sanity check, not a claim about how long
# Anthropic's windows are. A reset read in the wrong unit (epoch milliseconds
# through a rule expecting seconds) lands ~55,000 years out; unbounded, such a
# window is persisted, survives every restart and never elapses. A marked limit
# past this ceiling is capped to it; an unmarked one is not believed at all.
# Itself capped at 10 years, so a ceiling written in the wrong unit is rejected
# at startup rather than quietly becoming no ceiling at all.
max_reset_horizon_secs = 604800   # 7 days: Claude limits include weekly windows
# Random slack added past a reported reset time before transitioning to
# LIMITED, `[min, max]` inclusive, so the first probe after the window doesn't
# race the upstream reset boundary.
reset_jitter_secs = [15, 60]
# Whether a fallback request the provider rejects as too long is retried against the
# next larger model in your `model_map` instead of returning that error. Default on.
#
# Claude Code decides how big a session's context window is on its own side, from the
# `claude-*` name it selected — it cannot see which model your `model_map` sent that
# name to, so it will overshoot a smaller one believing it has room. Once the
# transcript by itself is over the window there is no way back: shrinking `max_tokens`
# does not help, and `/compact` needs a request that would also not fit, which is the
# `Error during compaction: Conversation too long` dead end whose only exit is
# `/clear`. A bigger model is usually already configured one slot up, so the relay
# tries it.
#
# Each hop is a *whole extra upstream request you pay for*, at the larger model's
# price, so the walk is bounded: each rung at most once, only upward, never a model this
# request has already failed on, and never for any error but a context limit. Price it
# by the rungs, not by the hop — the worst case for one request is **one upstream
# request per rung at or above where it started, so three under the default order** (and
# four if you add a fourth slot below).
#
# It also climbs only on evidence the *input* overflowed — the provider naming a token
# count that exceeds its limit. A body saying you "requested 195000 tokens (35000 in the
# messages, 160000 in the completion)" is your `max_tokens` reservation rather than your
# transcript, and Claude Code fixes that one itself for free, so paying for a bigger
# model there would buy an inference nobody needed. The cost of that caution: a genuine
# overflow a provider words limit-first, or with thousands separators, gets the error and
# no hop — which is what happened before this feature existed.
#
# On the last rung the client gets the same *kind* of translated error, reporting the
# model that finally refused. It also gets the rung below's error rather than a bare
# relay 502 when a hop cannot be sent, and rather than a 429 or 5xx when a hop fails with
# something the client would only retry — that would turn one failure into a retry loop
# that re-walks the ladder each time. A hop that fails *terminally* does report itself,
# so a rung pointing at a retired model shows you that 404 instead of hiding it.
escalate_on_context_limit = true
# The `model_map` slots that make up the ladder, smallest context window first. The
# default below is Anthropic's own size hierarchy, which is the ordering your map's
# targets were chosen against.
#
# Written out here rather than taken from the order your `model_map` entries appear
# in: that order already decides something else (which of two equal-length prefixes
# wins, §7a), so swapping two lines that tie on nothing would silently reorder the
# ladder.
#
# These are `model_map` keys, matched **exactly** — unlike `model_map` itself, which is
# prefix-matched against the incoming model name. A map keyed `"claude-sonnet-4-6"` is
# therefore not the `"claude-sonnet"` rung: that rung is skipped and the walk goes to the
# next one it can resolve, which is your most expensive model. A map keyed entirely with
# full model names escalates not at all, silently. Spell the two the same way, or list
# your own keys here.
#
# A slot no profile defines is skipped. A slot that is *not on this list* has no
# position on the ladder and never escalates — which is why `claude-fable` is absent:
# where it sits between sonnet and opus is not documented, and a wrong guess is a hop
# to a model that also cannot fit the prompt. Add it if your map points it at
# something smaller than your largest model. `"*"` is refused here: it is where names
# nothing else claims land, not a size tier, and it is often the largest target you
# have — reading it as the bottom rung would hop the wrong way.
escalation_order = ["claude-haiku", "claude-sonnet", "claude-opus"]
# Whether a fallback provider's reasoning — the `reasoning`/`reasoning_content`
# field a reasoning model returns alongside its answer — is surfaced to the
# client as an Anthropic `thinking` block, so Claude Code renders it as extended
# thinking. Default on: those tokens are billed to you whether or not you ever
# see them, and dropping them is the older behavior, not the safer one.
#
# Why it is a switch at all. Anthropic's own `thinking` blocks carry a
# cryptographic signature, and the relay cannot produce one — the reasoning came
# from the fallback provider, not from Anthropic — so the block the relay emits
# has no `signature` field. Fabricating one is documented to be rejected as
# tampering, so it does not; what an *unsigned* block does is unverified, which
# makes this a known unknown rather than a known-safe.
#
# Where it could bite is the round trip, not the response. Claude Code was
# observed normalizing the surfaced block into its transcript with
# `"signature": ""` — so omitting the field on the way out does not keep an
# unsigned signature out of the history that goes back up. On the fallback path
# that is still harmless (translating history to the OpenAI format drops
# `thinking` blocks entirely), but the Anthropic route forwards the client's body
# verbatim by design: a session that failed over and later recovers hands
# Anthropic a `thinking` block with an empty signature. If Anthropic rejects
# that, the session errors until it is cleared.
#
# `false` restores the old behavior exactly: the reasoning is discarded, no
# `thinking` block is ever synthesized, and nothing unsigned can reach Anthropic.
# Set it if you would rather not find out, or if a session that spans a limit
# window and recovers starts failing.
surface_fallback_reasoning = true

# Optional. A command run when the route state changes, so a limit doesn't have
# to be noticed by polling /status. Omit the section, or leave `command` out, to
# disable notifications entirely — that is the default.
#
# The command runs through `sh -c`, so it can be a whole shell line rather than
# only a path to a script. It receives the event in its environment:
#
#   RELAY_EVENT     failover_engaged | recovered | profile_switched |
#                   fallback_error
#   RELAY_RESET_AT  RFC3339 window end for failover_engaged, empty otherwise
#                   (the same value /status reports as `limited_until`)
#   RELAY_DETAIL    a one-line human-readable summary — for profile_switched,
#                   this is the only place the switched-to name appears; for
#                   fallback_error it names the profile and the cause, e.g.
#                   "together: http 401" or "together: upstream_unreachable"
#
# fallback_error fires when the fallback route stops delivering answers — a
# rejected key, an unreachable provider, a 5xx — **once per outage, not once per
# failed request**, and again only after five consecutive fallback requests have
# been delivered. One success is deliberately not enough: a throttling provider
# lets some requests through, so re-arming on one would notify again on the next
# failure. A failure belonging to one request (a malformed body, a context-limit
# 400) is not an outage and does not fire it, and neither does a 2xx whose
# *stream* dies after the headers. See docs/spec.md §4 for the full rule.
#
# It is fire-and-forget: nothing about a request waits on it, its output is
# whatever it writes to the relay's own stdout/stderr, and a command that has
# not exited within `timeout_secs` (1-60, default 5) is killed and logged as a
# warning.
# [notify]
# command = "notify-send 'claude-relay' \"$RELAY_DETAIL\""
# timeout_secs = 5
